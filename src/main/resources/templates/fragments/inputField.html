<html>
<body>
  <form>
    <th:block th:fragment="input (label, name)">
      <div th:with="valid=${!#fields.hasErrors(name)}"
        class="row mb-3">
        <label class="col-sm-2 col-form-label" th:text="${label}">Label</label>
        <div class="col-sm-10">
          <input th:classappend="${valid ? '' : 'is-invalid'}" class="form-control" type="text"
            th:field="*{__${name}__}" />
          <th:block th:if="${!valid}">
            <div class="invalid-feedback d-block" th:errors="*{__${name}__}">Error</div>
          </th:block>
        </div>
      </div>
    </th:block>
  </form>
</body>
</html>
