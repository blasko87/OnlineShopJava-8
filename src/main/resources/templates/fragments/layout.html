<!doctype html>
<html th:fragment="layout (template, menu)">

  <head>

    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8"/>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link rel="shortcut icon" type="image/x-icon" th:href="@{/resources/images/favicon.png}">

    <title>PetClinic :: a Spring Framework demonstration</title>

    <link rel="stylesheet" th:href="@{/webjars/bootstrap/dist/css/bootstrap.min.css}"/>
    <link rel="stylesheet" th:href="@{/webjars/bootstrap-icons/font/bootstrap-icons.min.css}"/>
    <link rel="stylesheet" th:href="@{/resources/css/petclinic.css}"/>

  </head>

<body>

  <nav class="navbar navbar-expand-lg navbar-dark bg-dark" role="navigation">
      <div class="container">
          <a class="navbar-brand" th:href="@{/}"><span></span></a>
          <button type="button" class="navbar-toggler" data-bs-toggle="collapse" data-bs-target="#main-navbar">
              <span class="visually-hidden">Toggle navigation</span>
              <span class="navbar-toggler-icon"></span>
          </button>
          <div class="navbar-collapse collapse" id="main-navbar">
              <ul class="navbar-nav ms-auto">

                  <li th:fragment="menuItem (path,active,title,icon,text)" class="nav-item" th:classappend="${active==menu ? 'active' : ''}">
                      <a class="nav-link" th:href="@{__${path}__}" th:title="${title}">
                        <i th:class="'bi bi-' + ${icon}" aria-hidden="true"></i>
                        <span th:text="${text}">Template</span>
                      </a>
                  </li>

                  <li th:replace="::menuItem ('/','home','home page','house-fill','Home')">
                      <span>Home</span>
                  </li>

                  <li th:replace="::menuItem ('/owners/find','owners','find owners','search','Find owners')">
                      <span>Find owners</span>
                  </li>

                  <li th:replace="::menuItem ('/vets.html','vets','veterinarians','list-ul','Veterinarians')">
                      <span>Veterinarians</span>
                  </li>

                  <li th:replace="::menuItem ('/oups','error','trigger a RuntimeException to see how it is handled','exclamation-triangle-fill','Error')">
                      <span>Error</span>
                  </li>

              </ul>
          </div>
      </div>
  </nav>
  <div class="container-fluid">
      <div class="container xd-container">

          <div th:replace="${template}"/>

        <br/>
        <br/>
        <div class="container">
          <div class="row">
            <div class="col-12 text-center">
              <img src="../static/resources/images/spring-pivotal-logo.png" th:src="@{/resources/images/spring-pivotal-logo.png}"
                alt="Sponsored by Pivotal"/></div>
          </div>
        </div>
      </div>
  </div>

  <script th:src="@{/webjars/jquery/jquery.min.js}"></script>
  <script th:src="@{/webjars/jquery-ui/jquery-ui.min.js}"></script>
  <script th:src="@{/webjars/bootstrap/dist/js/bootstrap.bundle.min.js}"></script>

</body>

</html>
