<!doctype html>
<html th:fragment="layout (template, menu)">

  <head>

    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8"/>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link rel="shortcut icon" type="image/x-icon" th:href="@{/resources/images/favicon.png}">

    <title>PetClinic :: a Spring Framework demonstration</title>

    <link rel="stylesheet" th:href="@{/webjars/bootstrap/css/bootstrap.min.css}"/>
    <link rel="stylesheet" th:href="@{/webjars/bootstrap-icons/font/bootstrap-icons.css}"/>
    <link rel="stylesheet" th:href="@{/resources/css/petclinic.css}"/>

  </head>

<body>

  <nav class="navbar navbar-expand-md navbar-dark" role="navigation">
    <div class="container">
      <a class="navbar-brand" th:href="@{/}"><span>PetClinic</span></a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
              data-bs-target="#main-navbar" aria-controls="main-navbar"
              aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="main-navbar">
        <ul class="navbar-nav ms-auto">

          <li th:fragment="menuItem (path,active,title,glyph,text)"
              class="nav-item"
              th:classappend="${active==menu ? 'active' : ''}">
            <a class="nav-link" th:href="@{__${path}__}" th:title="${title}">
              <span th:class="'bi bi-'+${glyph}" aria-hidden="true"></span>
              <span th:text="${text}">Template</span>
            </a>
          </li>

          <li th:replace="~{::menuItem ('/','home','home page','house','Home')}">
            <span class="bi bi-house" aria-hidden="true"></span>
            <span>Home</span>
          </li>

          <li th:replace="~{::menuItem ('/owners/find','owners','find owners','search','Find owners')}">
            <span class="bi bi-search" aria-hidden="true"></span>
            <span>Find owners</span>
          </li>

          <li th:replace="~{::menuItem ('/vets.html','vets','veterinarians','list','Veterinarians')}">
            <span class="bi bi-list" aria-hidden="true"></span>
            <span>Veterinarians</span>
          </li>

          <li th:replace="~{::menuItem ('/oups','error','trigger a RuntimeException to see how it is handled','exclamation-triangle','Error')}">
            <span class="bi bi-exclamation-triangle" aria-hidden="true"></span>
            <span>Error</span>
          </li>

        </ul>
      </div>
    </div>
  </nav>

  <div class="container-fluid">
    <div class="container xd-container">

      <div th:replace="${template}"/>

      <br/>
      <br/>
      <footer class="container">
        <div class="row">
          <div class="col-12 text-center">
            <img src="../static/resources/images/spring-pivotal-logo.png"
                 th:src="@{/resources/images/spring-pivotal-logo.png}"
                 alt="Sponsored by Pivotal"/>
          </div>
        </div>
      </footer>
    </div>
  </div>

  <script th:src="@{/webjars/jquery/jquery.min.js}"></script>
  <script th:src="@{/webjars/jquery-ui/jquery-ui.min.js}"></script>
  <script th:src="@{/webjars/bootstrap/js/bootstrap.bundle.min.js}"></script>

</body>

</html>
