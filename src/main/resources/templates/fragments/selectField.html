<html>
<body>
  <form>
    <th:block th:fragment="select (label, name, items)">
      <div th:with="valid=${!#fields.hasErrors(name)}" class="row mb-3">
        <label class="col-sm-2 col-form-label" th:text="${label}">Label</label>
        <div class="col-sm-10">
          <select
            th:classappend="${valid ? 'is-valid' : 'is-invalid'}"
            class="form-select"
            th:field="*{__${name}__}">
            <option th:each="item : ${items}" th:value="${item}"
              th:text="${item}">dog</option>
          </select>
          <div th:if="${!valid}" class="invalid-feedback"
               th:errors="*{__${name}__}">Error</div>
        </div>
      </div>
    </th:block>
  </form>
</body>
</html>
